<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Gallery</title>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
</head>
<body>
    <div class="background-field" aria-hidden="true">
        <span class="background-field__orb background-field__orb--one"></span>
        <span class="background-field__orb background-field__orb--two"></span>
        <span class="background-field__orb background-field__orb--three"></span>
    </div>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <main>
        <div id="canvas-container" aria-label="Interactive spiral image gallery"></div>
        <div class="scroll-space" aria-hidden="true"></div>
    </main>

    <div class="focus-overlay" id="focus-overlay" aria-hidden="true">
        <div class="focus-shell">
            <img id="focus-image" alt="">
        </div>
    </div>

    <div class="loader" id="loader" role="status" aria-label="Loading gallery">
        <div class="loader__track"><span id="loader-progress"></span></div>
    </div>

    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
